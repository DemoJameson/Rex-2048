<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Rex 2048 Debug</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #151b25;
        --panel-2: #1b2330;
        --line: #2a3443;
        --text: #eef3fb;
        --muted: #8d98aa;
        --accent: #5ee0a0;
        --warn: #ffd166;
        --danger: #ff7b7b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 0%, #1c2a3d 0, transparent 42%),
          radial-gradient(circle at 100% 100%, #201b33 0, transparent 38%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }
      h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; }
      .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
      .health {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.15fr);
        gap: 20px;
      }
      .panel {
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 18px 60px rgb(0 0 0 / 22%);
      }
      .panel h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 700; }
      .session-row { display: flex; gap: 8px; margin-bottom: 16px; }
      input, button {
        font: inherit;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        background: #0d131c;
        color: var(--text);
      }
      button {
        padding: 10px 13px;
        background: var(--panel-2);
        color: var(--text);
        cursor: pointer;
      }
      button:hover { border-color: #50627a; }
      button.primary { background: #1d5b43; border-color: #2b8b63; }
      button.warn { background: #4b3b19; border-color: #8b6d2b; }
      button:disabled { opacity: 0.45; cursor: default; }
      .board {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 12px;
        background: #0e141d;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .cell {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #252b36;
        color: #2b2620;
        font-size: clamp(20px, 4vw, 38px);
        font-weight: 800;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
      }
      .stat {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #0e141d;
      }
      .stat span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
      .stat strong { display: block; margin-top: 4px; font-size: 22px; }
      .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .controls button { min-height: 46px; }
      .status { margin-top: 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .status code { color: #b9d7ff; word-break: break-all; }
      .sessions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
      .session-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0e141d;
        font-size: 13px;
      }
      .session-item button { padding: 6px 9px; font-size: 12px; }
      .log {
        margin: 14px 0 0;
        padding: 12px;
        min-height: 180px;
        max-height: 300px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #080c12;
        color: #9fb0c6;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
      .muted { color: var(--muted); }
      @media (max-width: 860px) {
        header { align-items: flex-start; flex-direction: column; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <h1>Rex 2048 Debug</h1>
          <p class="sub">选集控制 → 服务端棋盘 → HTTP-FLV 视频流</p>
        </div>
        <div id="health" class="health">检查服务端…</div>
      </header>

      <div class="grid">
        <section class="panel">
          <h2>棋盘</h2>
          <div id="board" class="board"></div>
          <div class="stats">
            <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
            <div class="stat"><span>BEST</span><strong id="best">0</strong></div>
            <div class="stat"><span>COMMAND</span><strong id="seq">0</strong></div>
          </div>
          <div id="status" class="status">尚未开局</div>
        </section>

        <section class="panel">
          <h2>控制</h2>
          <div class="session-row">
            <input id="session" value="debug-local-01" spellcheck="false" />
            <button id="open">打开</button>
          </div>
          <div class="controls">
            <button data-episode="1" class="primary">1 开局</button>
            <button data-episode="2">2 上</button>
            <button data-episode="3">3 下</button>
            <button data-episode="4">4 左</button>
            <button data-episode="5">5 右</button>
            <button data-episode="6">6 重复</button>
            <button data-episode="7">7 撤销</button>
          </div>
          <div class="session-row" style="margin-top: 10px">
            <button id="duplicate" class="warn">重复发送上一 commandId</button>
            <button id="stream">打开 FLV 地址</button>
          </div>
          <div id="streamInfo" class="status">流地址：<span class="muted">等待开局</span></div>
          <div id="sessions" class="sessions"></div>
          <pre id="log" class="log"></pre>
        </section>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
